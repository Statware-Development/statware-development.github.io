<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Statware WebAR — Transformador</title>
  <link rel="stylesheet" href="./css/styles.css" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componentes A-Frame propios: deben registrarse ANTES de que el HTML
       de abajo declare entities que los usan (smooth-tracker, model-behavior). -->
  <script src="./js/smooth-tracker.js"></script>
  <script src="./js/model-controller.js"></script>
</head>
<body>
  <div id="ui">
    <div id="estado">Iniciando cámara…</div>
  </div>

  <!-- ▼▼▼ La version tambien se pisa desde js/app.js (APP_VERSION) ▼▼▼ -->
  <div id="version">v1.0.2</div>

  <!-- imageTargetSrc apunta al marcador compilado (targets/targets.mind) -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: true; uiScanning: yes; uiLoading: no; filterMinCF: 0.0005; filterBeta: 0.005; missTolerance: 10; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- El modelo real de Josue. OJO: el nombre debe coincidir EXACTO
           con el archivo en tu repo (respeta mayusculas y guion bajo). -->
      <a-asset-item id="transformador" src="./models/Encapsulado.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ============================================================
         MARCADOR + SUAVIZADO. mindar-image-target hace el tracking;
         smooth-tracker intercepta esa pose cruda cada frame y la
         suaviza en el lugar (lerp posicion, slerp rotacion, lerp
         escala) antes de que se use para dibujar a los hijos de este
         entity. El modelo cuelga de aqui igual que en la integracion
         estandar de MindAR -eso es lo que garantiza que la pose se
         interprete en el espacio de coordenadas correcto-.
         Sube lerp/slerp (hasta 1) si lo quieres mas reactivo; bajalo
         (hasta 0.1) si lo quieres mas suave/con mas inercia.
         ============================================================ -->
    <a-entity id="target-anchor-0" mindar-image-target="targetIndex: 0" smooth-tracker="lerp: 0.25; slerp: 0.25">
      <!-- ============================================================
           EL MODELO. Estos tres valores son los que vas a TUNEAR:
           scale   -> tamano. Si sale gigante baja a 0.2 / 0.1;
                      si sale chico sube a 1 / 2 / 3.
           rotation-> orientacion. Si sale ACOSTADO, cambia a "-90 0 0".
                      Si sale de espaldas, prueba "0 180 0".
           position-> "x y z". El tercer numero (z) lo empuja hacia el
                      visitante, despegandolo de la lona. Sube y (2do
                      numero) si quieres levantarlo del centro del marcador.
           ============================================================ -->
      <a-gltf-model
        id="transformador-model"
        src="#transformador"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        position="0 -0.5 0.2"
        model-behavior>
      </a-gltf-model>

      <!-- Cuando ya tengas escala/orientacion bien, descomenta esto para
           que gire lento sobre su eje:
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
        ... (mueve el <a-gltf-model> aqui dentro) ...
      </a-entity>
      -->
      <!-- Luz para que el PBR del modelo se vea con volumen -->
      <a-entity light="type: ambient; intensity: 2.5"></a-entity>
      <a-entity light="type: directional; intensity: 1.5" position="1 2 2"></a-entity>
      <a-entity light="type: directional; intensity: 1.0" position="-1 1 -1"></a-entity>
    </a-entity>

    <a-entity id="target-anchor-1" mindar-image-target="targetIndex: 1" smooth-tracker="lerp: 0.25; slerp: 0.25">
      <a-gltf-model
        src="#transformador"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        position="0 -0.5 0.2"
        model-behavior>
      </a-gltf-model>
      <a-entity light="type: ambient; intensity: 2.5"></a-entity>
      <a-entity light="type: directional; intensity: 1.5" position="1 2 2"></a-entity>
      <a-entity light="type: directional; intensity: 1.0" position="-1 1 -1"></a-entity>
    </a-entity>
  </a-scene>

  <script src="./js/ar-controller.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
